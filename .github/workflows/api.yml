name: API CI/CD

on:
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gilbertohennepin/country-route-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet test api

  deploy:
    needs: test                              # only runs if tests pass
    if: github.event_name == 'push'          # only on merge to main, not on PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: |
          az extension add --name containerapp --upgrade
          az containerapp update -n country-route-api -g country-route-rg --image ${{ env.IMAGE }}:${{ github.sha }}